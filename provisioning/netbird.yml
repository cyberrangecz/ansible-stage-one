---

- name: Discover NetBird management routing facts on MAN
  hosts: man
  become: true
  gather_facts: true
  tasks:
  - name: End the play when there are no VPN entrypoints
    meta: end_play
    when: groups['vpn_entrypoints'] | default([]) | length == 0

  - name: Extract the management server host from the URL
    set_fact:
      netbird_mgmt_host: "{{ global_netbird_management_url
                             | regex_replace('^[a-zA-Z][a-zA-Z0-9+.-]*://', '')
                             | regex_replace('[:/].*$', '') }}"

  - name: Determine the MAN router IP on the management network
    set_fact:
      netbird_man_gw: "{{ ansible_all_ipv4_addresses
                          | ansible.utils.ipaddr(global_sandbox_man_cidr)
                          | first | default('', true) }}"

  - name: Fail if no MAN router IP was found on the management network
    fail:
      msg: >-
        Could not find a MAN IP inside global_sandbox_man_cidr
        ({{ global_sandbox_man_cidr }}).
    when: netbird_man_gw | length == 0

  - name: Resolve the management server to IPv4 address(es)
    command: "getent ahostsv4 {{ netbird_mgmt_host }}"
    register: netbird_mgmt_getent
    changed_when: false

  - name: Build the list of management IPs to route
    set_fact:
      netbird_mgmt_ips: "{{ netbird_mgmt_getent.stdout_lines
                            | map('regex_replace', '\\s.*$', '')
                            | unique | list }}"


- name: Pin a persistent route to the NetBird management server over the management network
  hosts: vpn_entrypoints:!windows_hosts
  gather_facts: true
  become: true
  tasks:
    - name: Determine whether this host is a supported netplan Linux host
      set_fact:
        netbird_is_netplan: "{{ ansible_distribution == 'Ubuntu' or (ansible_distribution == 'Debian' and ansible_distribution_version is version('12', '>=')) }}"

    - name: Pin the management route via netplan (Linux)
      when: netbird_is_netplan
      block:
        - name: Find the management-network interface
          set_fact:
            netbird_mgmt_iface: "{{ item.device }}"
          loop: "{{ ansible_interfaces | map('regex_replace', '^', 'ansible_') | map('extract', vars) | selectattr('ipv4.address', 'defined') | list }}"
          loop_control:
            label: "{{ item.device }}"
          when:
            - netbird_mgmt_iface is not defined
            - (item.ipv4.address | ansible.utils.ipaddr(global_sandbox_man_cidr)) | default('', true) | length > 0

        - name: Fail if no management-network interface is found
          fail:
            msg: >-
              Could not find the management-network interface.
          when: netbird_mgmt_iface is not defined

        - name: Write a netplan drop-in pinning the management route via the MAN router
          copy:
            dest: /etc/netplan/60-netbird-mgmt-route.yaml
            owner: root
            group: root
            mode: '0600'
            content: |
              #jinja2: trim_blocks: True, lstrip_blocks: True
              network:
                version: 2
                ethernets:
                  {{ netbird_mgmt_iface }}:
                    routes:
                    {% for ip in hostvars['man'].netbird_mgmt_ips %}
                      - to: {{ ip }}/32
                        via: {{ hostvars['man'].netbird_man_gw }}
                    {% endfor %}
          register: netbird_route_netplan

        - name: Apply netplan
          command: netplan apply
          when: netbird_route_netplan is changed

    - name: Pin the management route via rc.conf.d (OPNsense/FreeBSD)
      when: ansible_system == 'FreeBSD'
      block:
        - name: Write an rc.conf.d drop-in pinning the management route via the MAN router
          copy:
            dest: /etc/rc.conf.d/routing
            owner: root
            group: wheel
            mode: '0644'
            content: |
              #jinja2: trim_blocks: True, lstrip_blocks: True
              static_routes="{% for ip in hostvars['man'].netbird_mgmt_ips %}nbmgmt{{ loop.index0 }} {% endfor %}"
              {% for ip in hostvars['man'].netbird_mgmt_ips %}
              route_nbmgmt{{ loop.index0 }}="-host {{ ip }} {{ hostvars['man'].netbird_man_gw }}"
              {% endfor %}

        - name: Add the management routes now (FreeBSD)
          command: "route -n add -host {{ item }} {{ hostvars['man'].netbird_man_gw }}"
          loop: "{{ hostvars['man'].netbird_mgmt_ips }}"
          register: netbird_route_add
          changed_when: netbird_route_add.rc == 0
          failed_when: netbird_route_add.rc != 0 and 'File exists' not in netbird_route_add.stderr


- name: Configure NetBird VPN entrypoints
  hosts: vpn_entrypoints
  gather_facts: true
  tasks:
    - name: Skip entrypoints without a usable NetBird configuration
      meta: end_host
      when: netbird_setup_key | default('') | length == 0

    - name: Determine whether this host is a supported netplan Linux host
      set_fact:
        netbird_is_netplan: "{{ ansible_distribution == 'Ubuntu' or (ansible_distribution == 'Debian' and ansible_distribution_version is version('12', '>=')) }}"

    - name: Skip Linux hosts that do not use netplan (only netplan Linux is supported)
      meta: end_host
      when: ansible_system == 'Linux' and not netbird_is_netplan

    - name: Compute the NetBird peer hostname
      set_fact:
        netbird_peer_hostname: "{{ ((global_sandbox_name | default(inventory_hostname, true)) | regex_replace('(?<=-p)0+(?=[0-9])', '') | regex_replace('(?<=-s)0+(?=[0-9])', '')) ~ '-' ~ inventory_hostname }}"

    # ----------------------------------------------------------------------- #
    # Linux                                                                   #
    # ----------------------------------------------------------------------- #
    - name: Configure NetBird agent
      when: ansible_system == 'Linux'
      become: true
      block:
        - name: Enable IP forwarding (Linux)
          sysctl:
            name: net.ipv4.ip_forward
            value: '1'
            sysctl_set: true
            state: present
            reload: true

        - name: Check whether the NetBird agent is already installed
          command: netbird version
          register: netbird_version
          changed_when: false
          failed_when: false

        - name: Install NetBird via official installer (Linux)
          shell:
            cmd: set -o pipefail && curl -fsSL https://pkgs.netbird.io/install.sh | sh
            executable: /bin/bash
          environment:
            NETBIRD_SKIP_UI_INSTALL: 'true'
          when: netbird_version.rc != 0

        - name: Ensure the NetBird service is enabled and running (Linux)
          systemd:
            name: netbird
            enabled: true
            state: started

        - name: Join the NetBird network
          include_tasks: tasks/netbird_join.yml

    # ----------------------------------------------------------------------- #
    # OPNsense / FreeBSD                                                       #
    #                                                                         #
    # Uses the official OPNsense "os-netbird" plugin rather than the raw      #
    # netbird package: it registers the wt0 tunnel as an OPNsense device so   #
    # OPNsense pf can filter it.                                              #
    #                                                                         #
    # NetBird runs as a userspace WireGuard routing peer here. Per netbird    #
    # issue #5327, its userspace firewall drops inbound packets before the    #
    # kernel and its masquerade does not rewrite source IPs. So we DISABLE    #
    # NetBird's firewall management (firewall.allowConfig = 0).               #
    # ----------------------------------------------------------------------- #
    - name: Configure NetBird agent (OPNsense / FreeBSD)
      when: ansible_system == 'FreeBSD'
      become: true
      block:

        - name: Install the NetBird OPNsense plugin (os-netbird)
          command: pkg install -y os-netbird
          register: netbird_pkg_install
          changed_when: "'already installed' not in netbird_pkg_install.stdout"

        # No configctl/CLI exists to toggle a plugin model value, so drive the
        # plugin's own model classes (the same path its API controllers use)
        # and persist to config.xml:
        #   - general.enable = 1     -> plugin manages the netbird service
        #   - firewall.allowConfig=0 -> NetBird does NOT manage pf (issue #5327);
        #                               OPNsense pf governs wt0 instead.
        #   - dns.enable = 0         -> NetBird does NOT manage DNS
        - name: Configure the NetBird plugin in the OPNsense configuration
          shell:
            cmd: |
              /usr/local/bin/php -r '
                require_once("config.inc");
                $s = new \OPNsense\Netbird\Settings();
                $changed = false;
                if ((string)$s->general->enable !== "1") { $s->general->enable = "1"; $changed = true; }
                if ((string)$s->firewall->allowConfig !== "0") { $s->firewall->allowConfig = "0"; $changed = true; }
                if ((string)$s->dns->enable !== "0") { $s->dns->enable = "0"; $changed = true; }
                if (!$changed) { echo "unchanged"; exit(0); }
                $s->serializeToConfig();
                \OPNsense\Core\Config::getInstance()->save();
                echo "changed";
              '
          register: netbird_enable_cfg
          changed_when: "'changed' in netbird_enable_cfg.stdout and 'unchanged' not in netbird_enable_cfg.stdout"

        - name: Render the NetBird service template into rc.conf.d (FreeBSD)
          command: configctl template reload OPNsense/Netbird
          when: netbird_enable_cfg is changed
          changed_when: true

        # The daemon must be running once before /var/db/netbird/config.json
        # exists; only then can sync-config write our plugin settings into it.
        - name: Ensure the NetBird daemon is running (FreeBSD)
          command: configctl netbird start
          changed_when: false

        - name: Wait for the NetBird runtime config to exist (FreeBSD)
          wait_for:
            path: /var/db/netbird/config.json
            timeout: 30

        - name: Sync plugin settings into the NetBird runtime config (FreeBSD)
          command: configctl netbird sync-config
          changed_when: false

        - name: Confirm NetBird's firewall management is disabled (FreeBSD)
          shell: |
            grep -q '"DisableFirewall": true' /var/db/netbird/config.json
          changed_when: false

        - name: Restart the NetBird daemon to apply the synced config (FreeBSD)
          command: configctl netbird restart
          when: netbird_enable_cfg is changed
          changed_when: true

        # Must run before the wt0 assignment below: netbird up brings the tunnel
        # up and puts the peer address on wt0, which the interface assignment
        # then (deliberately) strips and the final restart re-applies.
        - name: Join the NetBird network (FreeBSD)
          include_tasks: tasks/netbird_join.yml

        # NetBird's userspace firewall/masquerade does not work on FreeBSD
        # (issue #5327), so OPNsense must filter wt0 itself. wt0 has to be an
        # assigned interface before a rule can target it; the helper assigns it
        # and adds a single "pass in" rule, both idempotently.
        - name: Stage the wt0 firewall helper (FreeBSD)
          copy:
            src: netbird_opnsense_firewall.php
            dest: /tmp/netbird_opnsense_firewall.php
            owner: root
            group: wheel
            mode: '0600'

        - name: Assign wt0 and add its OPNsense pass rule
          command:
            argv:
              - /usr/local/bin/php
              - /tmp/netbird_opnsense_firewall.php
              - wt0
              - NETBIRD
              - "{{ netbird_opnsense_fw_source | default('any') }}"
              - netbird-wt0-allow (managed by ansible)
          register: netbird_fw
          changed_when: netbird_fw.stdout is search('^changed ')

        - name: Resolve the assigned wt0 interface id
          set_fact:
            netbird_wt0_ifid: "{{ netbird_fw.stdout.split() | last }}"

        - name: Apply the new interface assignment (FreeBSD)
          command: "configctl interface reconfigure {{ netbird_wt0_ifid }}"
          when: netbird_fw is changed
          changed_when: true

        - name: Reload the OPNsense firewall (FreeBSD)
          command: configctl filter reload
          when: netbird_fw is changed
          changed_when: true

        # Assigning/reconfiguring wt0 as an OPNsense interface (ipaddr=none)
        # strips the address NetBird put on the tunnel. Restart NetBird last so
        # the daemon re-applies its address; without this wt0 is left with only
        # a link-local address and nothing routes.
        - name: Re-apply the NetBird tunnel address after interface changes (FreeBSD)
          command: configctl netbird restart
          when: netbird_fw is changed
          changed_when: true

        - name: Wait for the NetBird tunnel to regain its IPv4 address (FreeBSD)
          command: ifconfig wt0
          register: netbird_wt0_ifconfig
          until: netbird_wt0_ifconfig.stdout is search('inet ')
          retries: 10
          delay: 3
          changed_when: false
          when: netbird_fw is changed

        - name: Remove the wt0 firewall helper (FreeBSD)
          file:
            path: /tmp/netbird_opnsense_firewall.php
            state: absent
