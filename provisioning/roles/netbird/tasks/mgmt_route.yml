---
# Runs on the VPN entrypoints. Pins a persistent route to the NetBird management
# server via the MAN router, so management traffic uses the management network
# rather than the tunnel. Depends on facts discovered by discover.yml on 'man'.

- name: Ensure the MAN discovery facts are available
  assert:
    that:
      - hostvars['man'].netbird_mgmt_ips is defined
      - hostvars['man'].netbird_man_gw is defined
    fail_msg: >-
      NetBird MAN facts are missing. The MAN discovery play must run before the
      entrypoints (do not --limit it out of the run).

- name: Determine whether this host is a supported netplan Linux host
  set_fact:
    netbird_is_netplan: >-
      {{ ansible_distribution == 'Ubuntu'
      or (ansible_distribution == 'Debian'
      and ansible_distribution_version is version('12', '>=')) }}

- name: Pin the management route via netplan (Linux)
  when: netbird_is_netplan
  block:
    - name: Find the management-network interface
      set_fact:
        netbird_mgmt_iface: "{{ item.device }}"
      loop: "{{ ansible_interfaces | map('regex_replace', '^', 'ansible_') | map('extract', vars) | selectattr('ipv4.address', 'defined') | list }}"
      loop_control:
        label: "{{ item.device }}"
      when:
        - netbird_mgmt_iface is not defined
        - (item.ipv4.address | ansible.utils.ipaddr(global_sandbox_man_cidr)) | default('', true) | length > 0

    - name: Fail if no management-network interface is found
      fail:
        msg: >-
          Could not find the management-network interface.
      when: netbird_mgmt_iface is not defined

    - name: Write a netplan drop-in pinning the management route via the MAN router
      copy:
        dest: /etc/netplan/60-netbird-mgmt-route.yaml
        owner: root
        group: root
        mode: '0600'
        content: |
          #jinja2: trim_blocks: True, lstrip_blocks: True
          network:
            version: 2
            ethernets:
              {{ netbird_mgmt_iface }}:
                routes:
                {% for ip in hostvars['man'].netbird_mgmt_ips %}
                  - to: {{ ip }}/32
                    via: {{ hostvars['man'].netbird_man_gw }}
                {% endfor %}
      notify: Apply netplan

- name: Pin the management route via rc.conf.d (OPNsense/FreeBSD)
  when: ansible_system == 'FreeBSD'
  block:
    - name: Write an rc.conf.d drop-in pinning the management route via the MAN router
      copy:
        dest: /etc/rc.conf.d/routing
        owner: root
        group: wheel
        mode: '0644'
        content: |
          #jinja2: trim_blocks: True, lstrip_blocks: True
          static_routes="{% for ip in hostvars['man'].netbird_mgmt_ips %}nbmgmt{{ loop.index0 }} {% endfor %}"
          {% for ip in hostvars['man'].netbird_mgmt_ips %}
          route_nbmgmt{{ loop.index0 }}="-host {{ ip }} {{ hostvars['man'].netbird_man_gw }}"
          {% endfor %}

    - name: Add the management routes now (FreeBSD)
      command: "route -n add -host {{ item }} {{ hostvars['man'].netbird_man_gw }}"
      loop: "{{ hostvars['man'].netbird_mgmt_ips }}"
      register: netbird_route_add
      changed_when: netbird_route_add.rc == 0
      failed_when: netbird_route_add.rc != 0 and 'File exists' not in netbird_route_add.stderr
