---
# Runs on the VPN entrypoints. Skips unusable hosts, computes the peer hostname,
# then dispatches to the per-OS agent tasks.

- name: Skip entrypoints without a usable NetBird configuration
  meta: end_host
  when: netbird_setup_key | default('') | length == 0

- name: Determine whether this host is a supported netplan Linux host
  set_fact:
    netbird_is_netplan: "{{ ansible_distribution == 'Ubuntu' or (ansible_distribution == 'Debian' and ansible_distribution_version is version('12', '>=')) }}"

- name: Skip Linux hosts that do not use netplan (only netplan Linux is supported)
  meta: end_host
  when: ansible_system == 'Linux' and not netbird_is_netplan

- name: Compute the NetBird peer hostname
  set_fact:
    netbird_peer_hostname: "{{ ((global_sandbox_name | default(inventory_hostname, true)) | regex_replace('(?<=-p)0+(?=[0-9])', '') | regex_replace('(?<=-s)0+(?=[0-9])', '')) ~ '-' ~ inventory_hostname }}"

- name: Configure the NetBird agent (Linux)
  when: ansible_system == 'Linux'
  become: true
  block:
    - name: Run the Linux agent tasks
      include_tasks: Linux.yml

- name: Configure the NetBird agent (OPNsense / FreeBSD)
  when: ansible_system == 'FreeBSD'
  become: true
  block:
    - name: Run the FreeBSD agent tasks
      include_tasks: FreeBSD.yml
